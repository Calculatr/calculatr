stages:
  - sync

sync_release_to_public:
  stage: sync
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s' "$GITHUB_KEY" | base64 -d > ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - ssh-keyscan github.com gitlab.com >> ~/.ssh/known_hosts
    - git config user.name "GitLab CI Sync"
    - git config user.email "ci@yaene.dev"
  script:
    - git checkout -B release origin/release

    - git remote set-url github "${GITHUB_REPO}" 2>/dev/null || git remote add github "${GITHUB_REPO}"
    - git remote set-url public_gitlab "${GITLAB_REPO}" 2>/dev/null || git remote add public_gitlab "${GITLAB_REPO}"

    - git push --force github release:main --follow-tags
    - git push --force public_gitlab release:main --follow-tags
