stages:
  - sync

sync_release_to_public:
  stage: sync
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
  before_script:
    - apk add --no-cache git openssh-client
    - eval $(ssh-agent -s)
    - echo "$GITHUB_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git config user.name "GitLab CI Sync"
    - git config user.email "ci@yaene.dev"
  script:
    - git checkout -B release origin/release

    # Remotes hinzufügen
    - git remote add github "${GITHUB_REPO}"
    - git remote add public_gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}"

    # Branch 'release' als 'main' auf beide Ziel-Repos pushen (inkl. Tags)
    - git push github release:main --follow-tags
    - git push public_gitlab release:main --follow-tags
