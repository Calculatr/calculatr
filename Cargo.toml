[package]
name = "calculatr"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
ratatui-image = "12.0.0-rc.3"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
typst = "0.15.1"
typst-render = "0.15.1"
typst-layout = "0.15.1"
typst-kit = "0.15.1"
image = { version = "0.25", default-features = false, features = ["png"] }
typst-assets = { version = "0.15", features = ["fonts"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-traits = "0.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
